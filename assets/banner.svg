<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F45"/>
      <stop offset="0.55" stop-color="#12306B"/>
      <stop offset="1" stop-color="#0F2A24"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5D48B"/>
      <stop offset="1" stop-color="#C8913A"/>
    </linearGradient>
    <pattern id="stars" width="64" height="64" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#E2B65F" stroke-opacity="0.10">
        <rect x="16" y="16" width="32" height="32"/>
        <rect x="16" y="16" width="32" height="32" transform="rotate(45 32 32)"/>
      </g>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#1F6FE0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1F6FE0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#stars)"/>
  <rect width="1200" height="300" rx="24" fill="url(#glow)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="118" fill="#F1EBE0" font-size="58" font-weight="700">Basmalah Qaseem</text>
    <text x="80" y="170" fill="url(#gold)" font-size="28" font-weight="600">Full-Stack Web &amp; Android Developer</text>
    <text x="80" y="222" fill="#F1EBE0" fill-opacity="0.65" font-size="20">PHP · MySQL · TypeScript · React · Next.js · Java (Android)</text>
  </g>

  <!-- code mark -->
  <g transform="translate(980 150)" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-60 -40 L-110 0 L-60 40"/>
    <path d="M60 -40 L110 0 L60 40"/>
    <path d="M22 -62 L-22 62"/>
  </g>
</svg>
