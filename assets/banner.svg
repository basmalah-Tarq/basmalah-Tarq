<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3D424B"/>
      <stop offset="1" stop-color="#2A2D33"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D6455B"/>
      <stop offset="1" stop-color="#A3182F"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7EFE4"/>
      <stop offset="1" stop-color="#E8D6BF"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="360" rx="28"/></clipPath>
    <clipPath id="face"><circle cx="0" cy="0" r="112"/></clipPath>
    <pattern id="stars" width="56" height="56" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#E8D6BF" stroke-opacity="0.07">
        <rect x="14" y="14" width="28" height="28"/>
        <rect x="14" y="14" width="28" height="28" transform="rotate(45 28 28)"/>
      </g>
    </pattern>
    <style>
      .rise { animation: rise .9s ease-out both; }
      .rise2 { animation: rise .9s .15s ease-out both; }
      .rise3 { animation: rise .9s .3s ease-out both; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      .spin { transform-origin: 960px 180px; animation: spin 40s linear infinite; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .rise, .rise2, .rise3, .caret, .spin { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#stars)"/>
    <!-- crimson sweep behind the portrait -->
    <path d="M760 0 H1200 V360 H640 Z" fill="url(#red)" opacity="0.92"/>
    <path d="M720 0 H760 L640 360 H600 Z" fill="#E8D6BF" opacity="0.18"/>
  </g>

  <!-- portrait -->
  <g class="spin">
    <circle cx="960" cy="180" r="140" fill="none" stroke="#F7EFE4" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 10"/>
  </g>
  <circle cx="960" cy="180" r="124" fill="#E8D6BF"/>
  <circle cx="960" cy="180" r="112" fill="#2A2D33"/>
  <!-- monogram -->
  <g transform="translate(960 180)" font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#D6455B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
      <path d="M-70 -22 L-88 0 L-70 22"/>
      <path d="M70 -22 L88 0 L70 22"/>
    </g>
    <text y="24" fill="#F7EFE4" font-size="72" font-weight="700" letter-spacing="2">BQ</text>
    <rect x="-26" y="44" width="52" height="4" rx="2" fill="#D6455B"/>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text class="rise" x="70" y="128" fill="#F7EFE4" font-size="60" font-weight="700">Basmalah Qaseem</text>
    <rect class="rise2" x="72" y="150" width="86" height="5" rx="2.5" fill="#D6455B"/>
    <text class="rise2" x="70" y="200" fill="url(#sand)" font-size="28" font-weight="600">Full-Stack Web &amp; Android Developer<tspan class="caret" fill="#D6455B"> |</tspan></text>
    <text class="rise3" x="70" y="246" fill="#F7EFE4" fill-opacity=".62" font-size="19">PHP · MySQL · TypeScript · React · Next.js · Java (Android)</text>
    <text class="rise3" x="70" y="296" fill="#E8D6BF" fill-opacity=".85" font-size="20" font-family="'Segoe UI', Tahoma, Arial, sans-serif">مطوّرة ويب وتطبيقات · أبني تطبيقات بالعربي والإنجليزي</text>
  </g>
</svg>
